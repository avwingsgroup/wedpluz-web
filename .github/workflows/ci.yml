name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_call:   # reused by deploy.yml as its required test gate

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel the test gate of a production deploy; superseded runs on other branches are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: OpenAPI contract is valid
        run: npm run openapi:validate

      # Production builds also enforce the guards in vite.config.ts (live API only, no secrets in VITE_*).
      - name: Production builds
        run: |
          npx vite build
          npx cross-env VITE_APP_TARGET=admin vite build --outDir dist-admin

  e2e:
    name: End-to-end (Chromium, mock API)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the dev server in mock mode (fixtures, never the real API).
      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
